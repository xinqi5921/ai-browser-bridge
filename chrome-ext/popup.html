<!DOCTYPE html>
<html>
<head><meta charset=UTF-8><style>
body{width:300px;padding:16px;font-family:sans-serif;font-size:14px}
.status{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;margin-bottom:12px}
.status.connected{background:#d1fae5;color:#065f46}
.status.disconnected{background:#fee2e2;color:#991b1b}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
h1{font-size:16px;margin:0 0 12px 0}
.info{background:#f3f4f6;padding:12px;border-radius:6px;margin-bottom:12px}
.info p{margin:4px 0;font-size:12px;color:#6b7280}
.info span{color:#111827;font-weight:500}
button{width:100%;padding:8px 16px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px}
button:hover{background:#2563eb}
button:disabled{background:#9ca3af;cursor:not-allowed}
</style></head>
<body>
<h1>AI Browser Bridge</h1>
<div class=status disconnected id=status><div class=dot></div><span id=status-text>Disconnected</span></div>
<div class=info><p>URL: <span id=url>-</span></p><p>Title: <span id=title>-</span></p></div>
<button id=connect-btn>Connect to MCP Server</button>
<script src=popup.js></script>
</body></html>
